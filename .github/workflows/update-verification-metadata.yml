on:
  workflow_call:
    inputs:
      java-version:
        type: string
        default: '25'

jobs:
  update-verification:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: gradle
      - name: Update verification metadata
        run: ./gradlew --write-verification-metadata sha256
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git diff --staged --quiet || git commit -m "chore: update dependency verification metadata"
          git push