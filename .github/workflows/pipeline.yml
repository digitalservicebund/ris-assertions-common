name: Pipeline

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - ".github/dependabot.yml"
  pull_request:
    branches: [main]
    paths-ignore:
      - ".github/dependabot.yml"
  workflow_dispatch:

jobs:
  pipeline:
    uses: digitalservicebund/ris-migration-common/.github/workflows/pipeline.yml@5441239062397c15f4bca5d3dc5f2d8db3dfdf18
    secrets: inherit
