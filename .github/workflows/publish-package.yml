name: Publish package to GitHub Packages

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  pipeline:
    uses: digitalservicebund/ris-migration-common/.github/workflows/pipeline.yml@2d5fa42bfbdde449514c20b82a0f49dc1c1f136e
    secrets: inherit

  publish:
    needs: [pipeline]
    uses: digitalservicebund/ris-migration-common/.github/workflows/publish-package.yml@2d5fa42bfbdde449514c20b82a0f49dc1c1f136e
    secrets: inherit
    permissions:
      contents: read
      packages: write
