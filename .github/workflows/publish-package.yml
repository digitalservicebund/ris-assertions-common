name: Publish package to GitHub Packages

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  # Runs the shared pipeline.yml before publishing; calling pipeline.yml here as well would
  # run it twice in one workflow run and fail on duplicate artifact names.
  publish:
    uses: digitalservicebund/ris-migration-common/.github/workflows/publish-package.yml@2d5fa42bfbdde449514c20b82a0f49dc1c1f136e
    secrets: inherit
    permissions:
      contents: read
      packages: write
