name: Publish package to GitHub Packages

permissions:
  contents: read

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  pipeline:
    uses: digitalservicebund/ris-migration-common/.github/workflows/pipeline.yml@d661e284515901f72c0ca6b60575d8cb8ad38762
    secrets: inherit

  publish:
    needs: [pipeline]
    uses: digitalservicebund/ris-migration-common/.github/workflows/publish-package.yml@d661e284515901f72c0ca6b60575d8cb8ad38762
    secrets: inherit
    permissions:
      contents: read
      packages: write
